name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    # TODO: verify this works

    steps:
    - uses: actions/checkout@v4
    
    - name: Set Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

    - name: Build
      run: xcodebuild build -scheme Aura -destination 'platform=macOS'

    - name: Test
      run: xcodebuild test -scheme Aura -destination 'platform=macOS'
